syntax = "proto2";

package lczero.training;

// Configuration for output queue used by stages.
message QueueConfig {
  // Queue overflow behavior.
  enum OverflowBehavior {
    BLOCK = 0;
    DROP_NEW = 1;
    KEEP_NEWEST = 2;
  }

  // Optional name for the output (used for multi-output stages).
  optional string name = 1;
  // Size of the output queue.
  optional uint64 queue_capacity = 2 [default = 4];
  // Overflow behavior of the output queue.
  optional OverflowBehavior overflow_behavior = 3;
}

// Configuration for file path provider that watches directories for new
// training files. Maps to FilePathProviderOptions in
// csrc/loader/chunk_feed/file_path_provider.h
message FilePathProviderConfig {
  // Path to directory containing training data files.
  optional string directory = 1;
  // Output queue configuration.
  optional QueueConfig output = 2;
}

// Configuration for chunk source loader that converts file paths to chunk
// sources. Maps to ChunkSourceLoaderOptions in
// csrc/loader/chunk_feed/chunk_source_loader.h
message ChunkSourceLoaderConfig {
  enum FrameFormat {
    V6TrainingData = 0;
    V7TrainingData = 1;
  }
  // Number of worker threads for loading.
  optional uint64 threads = 1 [default = 1];
  // Output queue configuration.
  optional QueueConfig output = 2;
  // Training data frame format.
  optional FrameFormat frame_format = 3;
}

message PositionSamplingConfig {
  optional float diff_focus_q_weight = 1 [default = 0.0];
  optional float diff_focus_pol_scale = 2 [default = 1.0];
  optional float diff_focus_alpha = 3 [default = 1.0];
  optional float diff_focus_beta = 4 [default = 0.0];
  optional float diff_focus_gamma = 5 [default = 1.0];
  optional float diff_focus_tau = 6 [default = 1.0];
  optional float default_weight = 7 [default = 1.0];

  // Weight on the temporal curvature of the evaluation: how far a
  // position's root_q sits off the straight line drawn between its two
  // neighbouring plies in the same game. Low curvature means the position
  // continues the game's evaluation trend ("a true continuation"); high
  // curvature marks a discontinuity -- a tactic, a blunder, or a search
  // disagreement.
  //
  // Unset (the default) leaves sampling weights bit-identical to what they
  // were before this field existed.
  //
  // This is deliberately independent of the diff_focus_* terms above.
  // Those are driven by orig_q, which is NaN on any corpus converted from
  // PGN rather than produced by self-play with an eval cache -- and on
  // such a corpus the diff_focus path returns default_weight for every
  // position, making it entirely inert. The curvature term needs only
  // root_q, which is always populated, so it still works there.
  optional float temporal_curvature_weight = 8;

  // Weight on material-sacrifice EVENTS and the plies that follow them.
  //
  // Selects on the decision, not on the result: a position qualifies when
  // the side to move gives up at least sacrifice_threshold material over
  // the next sacrifice_window_plies, whatever the evaluation says about
  // how it turned out. That distinction is the whole point of this term.
  //
  // Selecting on the RESULT instead -- e.g. "down material but still
  // winning" -- looks equivalent and is not. Unsound sacrifices have
  // material and evaluation in agreement (both say losing), so a
  // result-based rule silently filters them out and feeds the model
  // almost only sacrifices that worked. A model trained on that sample
  // learns "down material implies winning" and turns sacrifice-happy,
  // because it was never shown the counter-examples. Measured on this
  // corpus, the event rule selects 5.1% of positions split 44% winning /
  // 38% losing, which is the balance that forces the model to learn what
  // actually separates a sound sacrifice from an unsound one.
  optional float material_sacrifice_weight = 9;

  // Plies to look ahead when deciding whether material was given up. Must
  // outlast a normal capture-recapture exchange, or every routine trade
  // registers as a sacrifice.
  optional uint32 sacrifice_window_plies = 10 [default = 4];

  // Net material, in pawns, that must be given up to count as an event.
  optional float sacrifice_threshold = 11 [default = 2.0];

  // How far the boost propagates FORWARD from the sacrifice. This is the
  // "...but it's for this" half: the plies that follow are what justify
  // the sacrifice, so they are trained alongside it rather than being
  // left to ordinary sampling. Decayed by sacrifice_decay per ply.
  optional uint32 sacrifice_lookahead_plies = 12 [default = 6];
  optional float sacrifice_decay = 13 [default = 0.8];

  // Weight on a material CONFIGURATION -- a phase filter, deliberately not
  // a tactics detector.
  //
  // Queen endgames are where this is aimed: measured on this corpus they
  // are 2.88% of all positions, so uniform sampling shows the model very
  // few of them, and they are the phase where evaluation is decided by
  // concrete forcing sequences rather than by structure.
  //
  // It is tempting to select them by evaluation volatility instead. That
  // does not work, and the measurement is unambiguous: queen endgames have
  // the LOWEST median per-ply eval movement of any phase in this corpus
  // (0.0047 against 0.0302 overall). Stockfish's evaluation is at its
  // steadiest precisely where its search has resolved the tactics, so any
  // volatility-derived signal looks away from exactly the positions
  // wanted. Selecting on the material configuration sidesteps that
  // entirely -- it reads the board, not the evaluation.
  optional float endgame_focus_weight = 14;

  // Total material on the board, in pawns and counting both sides, at or
  // below which a position qualifies. Kings excluded.
  optional float endgame_material_max = 15 [default = 30.0];

  // Require at least one queen, which is what narrows a general endgame
  // filter to the queen endgames specifically.
  optional bool endgame_require_queens = 16 [default = false];
}

// Configuration for shuffling chunk pool that manages chunk shuffling and
// loading. Maps to ShufflingChunkPoolOptions in
// csrc/loader/chunk_feed/shuffling_chunk_pool.h
message ShufflingChunkPoolConfig {
  // Size of the chunk shuffle buffer.
  optional uint64 chunk_pool_size = 1 [default = 100000];
  // Threads for ingesting new chunk sources (lightweight).
  optional uint64 source_ingestion_threads = 3 [default = 1];
  // Threads for loading chunk data.
  optional uint64 chunk_loading_threads = 4 [default = 4];
  // Output queue configuration.
  optional QueueConfig output = 5;
  // When set to a positive value, enable Hanse single-position sampling.
  // Probability to accept a chunk is
  //   min(1.0, num_records / hanse_sampling_threshold) ** hanse_sampling_gamma
  // where num_records is the number of frames in the chunk.
  optional uint64 hanse_sampling_threshold = 6;  // by default, disabled.
  optional double hanse_sampling_gamma = 7 [default = 1.0];
  optional PositionSamplingConfig position_sampling = 11;
  // Optional output queue for cache hit frames.
  optional QueueConfig cachehit_output = 8;
  // Size of the position cache per chunk.
  optional uint64 position_cache_size = 9;
  // Threads for caching positions.
  optional uint64 caching_threads = 10 [default = 1];
}

// Configuration for chunk rescorer that adjusts chunk metadata using
// tablebases. Maps to ChunkRescorerOptions in
// csrc/loader/stages/chunk_rescorer.h
message ChunkRescorerConfig {
  // Number of worker threads for rescoring.
  optional uint64 threads = 1 [default = 1];
  // Output queue configuration.
  optional QueueConfig output = 2;
  // Comma-separated list of Syzygy tablebase directories.
  optional string syzygy_paths = 3;
  // Policy reshaping temperature.
  optional float dist_temp = 4 [default = 1.0];
  // Policy offset applied during rescoring.
  optional float dist_offset = 5 [default = 0.0];
  // DTZ boost factor when policy adjustments apply.
  optional float dtz_boost = 6 [default = 0.0];
  // Optional conversion target for input format (-1 keeps original).
  optional int32 new_input_format = 7 [default = -1];
  // Optional deblunder threshold for policy adjustments.
  optional float deblunder_threshold = 8;
  // Optional deblunder width controlling smoothing around the threshold.
  optional float deblunder_width = 9;
  // Comma-separated list of Gaviota tablebase directories.
  optional string gaviota_paths = 11;
  // Soft threshold for st_q when converting v6 to v7.
  optional float st_q_theta = 12 [default = 0.8333333333];
}

// Configuration for chunk unpacker that extracts frames from packed chunks.
// Maps to ChunkUnpackerOptions in csrc/loader/chunk_feed/chunk_unpacker.h
message ChunkUnpackerConfig {
  // Number of worker threads for unpacking.
  optional uint64 threads = 1 [default = 1];
  // Probability of sampling each position within a chunk.
  optional float position_sampling_rate = 2 [default = 1.0];
  // Number of positions to take from each chunk.
  optional uint32 position_count = 3;
  // Output queue configuration.
  optional QueueConfig output = 4;
  // Number of positions to prefetch for caching.
  optional uint32 prefetch_count = 5;
  // Optional output queue for prefetch cache requests.
  optional QueueConfig prefetch_output = 6;

  optional PositionSamplingConfig position_sampling = 7;
}

// Configuration for shuffling frame sampler using reservoir sampling.
// Maps to ShufflingFrameSamplerOptions in csrc/loader/shuffling_frame_sampler.h
message ShufflingFrameSamplerConfig {
  // Number of worker threads.
  optional uint64 threads = 1 [default = 1];
  // Size of sampling reservoir per thread.
  optional uint64 reservoir_size_per_thread = 2 [default = 1000000];
  // Output queue configuration.
  optional QueueConfig output = 3;
}

// Configuration for tensor generator that converts frames to batched tensors.
// Maps to TensorGeneratorOptions in csrc/loader/tensor_generator.h
message TensorGeneratorConfig {
  // Number of worker threads for tensor generation.
  optional uint64 threads = 1 [default = 1];
  // Batch size for tensor generation.
  optional uint64 batch_size = 2 [default = 1024];
  // Output queue configuration.
  optional QueueConfig output = 3;
}

// Configuration for a stage that splits incoming ChunkSources into several
// outputs based on a deterministic hash of (chunk source name, index within
// source). For each configured output, provides a name, weight that controls
// the proportion of indices assigned to it, and queue parameters.
message ChunkSourceSplitterConfig {
  // List of output queue configurations.
  repeated QueueConfig output = 1;
  // Relative weights for hash-based assignment (parallel to output).
  repeated uint64 weight = 2;
}

// Configuration for simple chunk shuffler that processes one chunk source at a
// time and outputs all chunks in shuffled order.
message SimpleChunkExtractorConfig {
  // Output queue configuration.
  optional QueueConfig output = 1;
}

// Configuration for join stage that merges multiple input streams.
message JoinPositionsConfig {
  // Output queue configuration.
  optional QueueConfig output = 1;
}

// Stage-level configuration providing a name and stage-specific options.
message StageConfig {
  // Unique name used to reference the stage output.
  optional string name = 1;
  // Names of upstream stages providing input to this stage.
  repeated string input = 2;
  // Field 3 reserved for future output configuration.
  optional FilePathProviderConfig file_path_provider = 4;
  optional ChunkSourceLoaderConfig chunk_source_loader = 5;
  optional ShufflingChunkPoolConfig shuffling_chunk_pool = 6;
  optional ChunkUnpackerConfig chunk_unpacker = 7;
  optional ShufflingFrameSamplerConfig shuffling_frame_sampler = 8;
  optional TensorGeneratorConfig tensor_generator = 9;
  optional ChunkRescorerConfig chunk_rescorer = 10;
  optional ChunkSourceSplitterConfig chunk_source_splitter = 11;
  optional SimpleChunkExtractorConfig simple_chunk_extractor = 12;
  optional JoinPositionsConfig join_positions = 13;
}

// Main configuration class for the DataLoader containing all component
// configurations.
message DataLoaderConfig {
  // Ordered list of stage configurations comprising the pipeline.
  repeated StageConfig stage = 1;
  // Exposed outputs, each with an optional alias used by clients to fetch
  // data. Expected format: "alias:stage.output", where "alias:" and ".output"
  // are optional.
  repeated string output = 2;
}
