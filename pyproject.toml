[project]
name = "lczero-training"
version = "0.1.0"
description = "Training scripts and data loading for Leela Chess Zero"
authors = [{ name = "Leela Chess Zero Team" }]
readme = "README.md"
# 3.12 rather than 3.13: torch-directml does not publish 3.13 wheels, so the
# native Windows DirectML environment (the `directml` extra) has to be a 3.12
# interpreter. Nothing in the base package needs 3.13.
requires-python = ">=3.12"
# Accelerator dependencies are deliberately NOT in this list. The default
# install is CPU-only JAX; see the `cuda` and `directml` extras below.
dependencies = [
    "pybind11>=2.10.0",
    "numpy>=1.24.0",
    "textual[dev]>=0.47.0",
    "protobuf==6.33.5",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "anyio>=4.10.0",
    "jax==0.9.1",
    "flax>=0.11.1",
    "optax>=0.2.5",
    "orbax-checkpoint>=0.11.23",
    "python-dotenv>=1.1.1",
    "requests[socks]>=2.32.5",
    "matplotlib>=3.10.6",
    "jaxlib==0.9.1",
    "onnxruntime>=1.23.1",
    "tensorboardx>=2.6.4",
    "graphviz>=0.21",
    "meson>=1.10.1",
    "ruff>=0.15.4",
]

[project.scripts]
lc0-leela2jax = "lczero_training.commands.leela2jax:main"
lc0-jax2leela = "lczero_training.commands.jax2leela:main"
lc0-describe = "lczero_training.commands.describe_training:main"
lc0-test-dataloader = "lczero_training.commands.test_dataloader:main"
lc0-dataloader-viz = "lczero_training.commands.dataloader_viz:main"
lc0-overfit = "lczero_training.commands.overfit:main"
lc0-init = "lczero_training.commands.training_init:main"
lc0-eval = "lczero_training.commands.training_eval:main"
lc0-tune-lr = "lczero_training.commands.tune_lr:main"
lc0-migrate-checkpoint = "lczero_training.commands.migrate_checkpoint:main"
lc0-backfill-metrics = "lczero_training.commands.backfill_metrics:main"
lc0-train = "lczero_training.commands.train:main"
lc0-daemon = "lczero_training.commands.daemon:main"
lc0-tui = "lczero_training.commands.tui:main"
lc0-weights = "lczero_training.commands.weights_tool:main"
lc0-directml-device = "lczero_training.commands.directml_device:main"
lc0-directml-bench-kda = "lczero_training.directml.benchmark_kda:main"
lc0-directml-init = "lczero_training.commands.directml_init:main"
lc0-directml-train = "lczero_training.commands.directml_train:main"
lc0-directml-export = "lczero_training.commands.directml_export:main"
lc0-directml-daemon = "lczero_training.commands.directml_daemon:main"
lc0-directml-eval-worker = "lczero_training.commands.directml_eval_worker:main"
lc0-directml-supervisor = "lczero_training.commands.directml_supervisor:main"
lc0-directml-tui = "lczero_training.commands.directml_tui:main"

[project.optional-dependencies]
# CUDA JAX training. Kept out of the default install because the CUDA plugin
# wheels are several gigabytes.
cuda = [
    "jax[cuda12]==0.9.1",
    "onnxruntime-gpu>=1.23.0",
]
# Native Windows DirectML training (docs/directml_training_port.md). Windows
# only, and never part of a Linux environment -- Linux CI must be able to
# import lczero_training without PyTorch installed.
directml = [
    "torch==2.4.1 ; sys_platform == 'win32'",
    "torch-directml==0.2.5.dev240914 ; sys_platform == 'win32'",
]
# Linux CUDA PyTorch training -- the same trainer as `directml`, on a real
# GPU. Separate from the `cuda` extra above, which is JAX: these two are
# alternative trainers, not layers, and installing both only wastes disk.
#
# Not pinned to 2.4.1 like the DirectML extra. That pin exists because
# torch-directml 0.2.5 builds against exactly that version; nothing on the
# CUDA side shares the constraint, and newer torch has markedly better
# compile support for the KDA chunked scan.
#
# The platform marker is what lets this coexist with `directml` in one lock
# file: the two resolve on different operating systems and never collide.
cuda-torch = [
    "torch>=2.5 ; sys_platform == 'linux'",
    "psutil>=5.9",
]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "typing-extensions>=4.0.0",
    "mypy-extensions>=0.4.0",
    "pathspec>=0.11.0",
]

[build-system]
requires = ["setuptools>=64", "pybind11>=2.10.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.so", "*.dll", "*.dylib"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.76.0",
    "mypy-protobuf>=3.6.0",
    "textual-dev>=1.7.0",
    "types-protobuf>=6.30.2.20250809",
    "types-requests>=2.32.4.20250913",
]

[tool.mypy]
mypy_path = "src"
# TEMPORARY: Disable misc errors due to protobuf bug in PR #23156
# (https://github.com/protocolbuffers/protobuf/pull/23156)
# Revert when protobuf fixes __slots__ = () in generated .pyi files
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "orbax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "optax"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tensorboardX"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch_directml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

# Resolve torch from the CPU wheel index. Plain PyPI `torch` on Windows/Linux
# drags in several gigabytes of CUDA runtime packages that the DirectML
# backend never touches.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ...except on Linux, where the cuda-torch extra exists precisely to get a
# CUDA build. Pointing `torch` at the CPU index unconditionally made that
# extra silently useless: `uv sync --extra cuda-torch` installed a +cpu
# wheel, torch.cuda.is_available() returned False, and the only way anyone
# ever got a working trainer was to pip-install a CUDA wheel by hand --
# which the next `uv run` then overwrote, because uv re-syncs the
# environment before running anything. Selecting the index by platform is
# what makes the extra mean what its name says.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# cu128 rather than an older CUDA: Blackwell (sm_120) has no kernels in
# CUDA 12.6 or earlier, so an RTX PRO / RTX 50-series card loads the wheel
# and then fails at the first kernel launch.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]


[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]
addopts = "-v"
markers = [
  # Opt-in: subprocess_eval's environmental low-memory skip lives behind
  # this marker. The default autouse fixture in test_subprocess_eval bypasses
  # the guard; only tests that want to exercise it mark themselves with
  # ``@pytest.mark.enable_memory_guard`` so a CI box with low free memory
  # does not silently skip every real-spawn test for unrelated reasons.
  "enable_memory_guard: bypass the autouse bypass of subprocess_eval's memory guard",
]

[tool.ruff]
exclude = ["*_pb2.py*"]
line-length = 80

[tool.uv]
# directml pins torch==2.4.1 (torch-directml builds against exactly that) and
# cuda-torch needs torch>=2.5. The sys_platform markers make them mutually
# exclusive at install time, but uv resolves universally and sees a conflict,
# so the exclusivity has to be declared explicitly.
conflicts = [
    [
        { extra = "directml" },
        { extra = "cuda-torch" },
    ],
]

# The two platforms this project actually targets, declared so uv resolves
# them as separate splits. Without this the universal resolver puts Windows
# and Linux in one split (`sys_platform != 'darwin'`) and rejects the
# per-platform torch indexes above as "conflicting indexes for package
# torch" -- the CPU index and the cu128 index both apply to the same split.
# Naming the environments makes those markers disjoint, so each platform
# resolves torch from exactly one index.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
