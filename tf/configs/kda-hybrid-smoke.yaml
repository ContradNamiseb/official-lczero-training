%YAML 1.2
---
name: 'kda-hybrid-smoke-128x2-no-rmsnorm'
gpu: 0
dataset:
    num_chunks: 10_000
    allow_less_chunks: true
    train_ratio: 0.95
    input_train:
        - '/path/to/training-data/*/'
    input_test:
        - '/path/to/test-data/*/'
    train_workers: 4
    test_workers: 2
    fast_chunk_loading: true
training:
    precision: single
    disable_pb_checkpointing: true
    disable_saved_model_checkpointing: true
    detailed_summaries: false
    swa: false
    max_grad_norm: 1.0
    batch_size: 256
    num_batch_splits: 1
    value_focus_min: 1.0
    value_focus_slope: 0.0
    lookahead_optimizer: false
    renorm: false
    test_steps: 100
    num_test_positions: 4096
    train_avg_report_steps: 100
    total_steps: 5000
    checkpoint_steps: 1000
    shuffle_size: 100_000
    warmup_steps: 100
    mask_legal_moves: true
    lr_values:
        - 0.001
        - 0.001
    lr_boundaries:
        - 100
    loss_weights:
        policy: 1.0
        policy_optimistic_st: 1.0
        policy_soft: 8.0
        policy_opponent: 0.0
        policy_next: 0.0
        value_winner: 1.0
        value_q: 1.0
        value_q_cat: 0.1
        value_st: 1.0
        value_q_err: 10.0
        value_st_err: 10.0
        value_st_cat: 0.1
        moves_left: 1.0
        reg: 1.0
    path: 'networks'
    optimizer: nadam
    beta_1: 0.9
    beta_2: 0.98
    epsilon: 0.00000001
    sparse: false
model:
    embedding_size: 128
    policy_embedding_size: 128
    value_embedding_size: 64
    moves_left_embedding_size: 16
    encoder_layers: 2
    # 8 heads so it divides evenly by the 8-direction KDA scan below.
    encoder_heads: 8
    encoder_d_model: 128
    encoder_dff: 128
    encoder_mixer_pattern: [kda, mha]
    kda_key_dim: 32
    kda_value_dim: 32
    kda_gate_rank: 16
    kda_directions:
        - rank_forward
        - rank_reverse
        - file_forward
        - file_reverse
        - diag_forward
        - diag_reverse
        - anti_diag_forward
        - anti_diag_reverse
    kda_output_gate: true
    policy_d_model: 128
    policy_d_aux: 128
    dropout_rate: 0.0
    embedding_style: 'new'
    embedding_dense_sz: 32
    value: 'wdl'
    moves_left: 'v1'
    input_type: 'classic'
    use_smolgen: true
    smolgen_hidden_channels: 8
    smolgen_hidden_sz: 64
    smolgen_gen_sz: 64
    smolgen_activation: 'swish'
    use_logit_gating: false
    omit_qkv_biases: true
    omit_other_biases: false
    return_attn_wts: false
    policy_optimistic_st: true
    policy_opponent: false
    policy_next: false
    value_st: true
    value_q: true
    soft_policy: true
    categorical_value_buckets: 16
    soft_policy_temperature: 4.0