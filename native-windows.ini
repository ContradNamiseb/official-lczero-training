# Meson native file for the native Windows (MSVC) build of the C++ loader.
#
# Pairs with the Python 3.12 DirectML environment: the pybind11 extension
# must be built against the same interpreter that will import it.
#
#   cmd /c "call vcvars64.bat && meson setup build\windows --native-file native-windows.ini"
#
# See docs/directml_training_port.md.

[binaries]
python = '@GLOBAL_SOURCE_ROOT@/.venv-directml/Scripts/python.exe'
